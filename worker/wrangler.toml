name = "indianopenmaps"
main = "src/index.js"
compatibility_date = "2024-11-01"
# nodejs_compat needed because @basemaps/tiler uses process.env at module init
# Keep default cross-request promise handling: cache-fill notifications must
# resume each waiter in its own request context.
compatibility_flags = ["nodejs_compat", "cache_option_enabled", "cache_no_cache_enabled"]
workers_dev = true

routes = [
  { pattern = "indianopenmaps.com", custom_domain = true },
  { pattern = "www.indianopenmaps.com", custom_domain = true }
]

[vars]
# Source metadata/STAC refresh and browser tile freshness. Set to "0" and push to roll back
# periodic refresh, conditional tile responses and the viewer URL migration.
CACHE_REVALIDATION_SECONDS = "3600"

# Use the Workers Paid CPU budget explicitly, including on migrated accounts.
[limits]
cpu_ms = 30_000

[assets]
directory = "./static"
binding = "ASSETS"

[observability]
[observability.logs]
enabled = true
invocation_logs = true
